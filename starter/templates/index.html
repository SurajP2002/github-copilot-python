<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Sudoku Game</h1>
    <div class="theme-controls">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-pressed="false">Dark Mode: Off</button>
      <span id="theme-status" aria-live="polite"></span>
    </div>
  </header>
  <p id="current-difficulty" aria-live="polite">Current difficulty: Medium</p>
  <p>Time: <span
    id="timer"
    role="timer"
    aria-label="Elapsed time"
    aria-live="off">00:00</span></p>
  <p>Hints used: <span id="hints-used" aria-live="polite">0</span></p>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="use-hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="message" aria-live="polite"></span>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Fastest Times</h2>
    <p id="leaderboard-status" aria-live="polite"></p>
    <div class="leaderboard-table-wrapper">
      <table>
        <thead>
          <tr>
            <th scope="col">Player</th>
            <th scope="col">Time</th>
            <th scope="col">Difficulty</th>
            <th scope="col">Hints</th>
          </tr>
        </thead>
        <tbody id="leaderboard-entries">
          <tr><td colspan="4">No scores yet.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <dialog id="player-name-dialog" aria-labelledby="player-name-title">
    <form id="player-name-form" novalidate>
      <h2 id="player-name-title">Add your score</h2>
      <label for="player-name">Your name</label>
      <input
        id="player-name"
        name="playerName"
        type="text"
        autocomplete="name"
        maxlength="40"
        aria-required="true"
        aria-describedby="player-name-error">
      <p id="player-name-error" role="alert"></p>
      <div class="dialog-controls">
        <button type="submit">Save Score</button>
        <button id="skip-score" type="button">Skip</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
